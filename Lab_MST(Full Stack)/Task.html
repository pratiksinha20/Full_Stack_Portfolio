<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<Style>
    body{
        align-items: center;
        display: flex;
        flex-direction: column;
        margin: 30px;
        margin-top: 200px;
        padding: 20px;
        /* border: 1px solid black; */
        background-color: bisque;
    }
</Style>
<body>
    <section style="border: solid black 2px; margin: auto; padding: 20px; background-color: rgb(209, 193, 169);">
    <h2>CU Student Task Manager</h2>
<div style="content: flex; justify-content: center; gap: 10px;">
<input type="text" id="taskInput" placeholder="Enter task">
 <br>

<select id="priority">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>

<button onclick="addTask()">Add Task</button>
</div>
<br>
<div style="content: flex; justify-content: center; gap: 10px;">
<button onclick="filterTasks('all')">Show All</button>
<button onclick="filterTasks('completed')">Completed</button>
<button onclick="filterTasks('pending')">Pending</button>
</div>
<ul id="taskList"></ul>
</section>
</body>
<script src="Task.js"></script>
</html>
